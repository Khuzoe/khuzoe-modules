name: Compila Khuzoe Updater
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/CoreTests.cs', 'tools/build-app.ps1', 'publisher.config.json', '.github/workflows/build-updater.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: khuzoe-app-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica app su cartelle di prova
        shell: pwsh
        run: ./tools/build-app.ps1 -Test
      - name: Compila eseguibile Windows
        shell: pwsh
        run: ./tools/build-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KhuzoeUpdater-Windows
          path: |
            dist/KhuzoeUpdater.exe
            dist/KhuzoeUpdater.exe.config
      - name: Pubblica app se la versione è nuova
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content app/version.txt -Raw).Trim()
          $tag = "updater-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "La versione $version esiste già. Per distribuire modifiche all'app, aumenta app/version.txt."
            exit 0
          }
          gh release list --repo $env:GITHUB_REPOSITORY --limit 1 *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Impossibile verificare le Releases GitHub.' }
          Compress-Archive -LiteralPath dist/KhuzoeUpdater.exe,dist/KhuzoeUpdater.exe.config -DestinationPath dist/KhuzoeUpdater-Windows.zip
          gh release create $tag dist/KhuzoeUpdater-Windows.zip dist/KhuzoeUpdater.exe dist/KhuzoeUpdater.exe.config --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Khuzoe Updater $version" --notes 'Scarica lo ZIP, estrailo e apri KhuzoeUpdater.exe. Al primo avvio scegli la cartella Foundry.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione app non riuscita.' }
