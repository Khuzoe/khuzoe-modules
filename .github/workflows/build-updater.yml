name: Compila Khuzoe Updater
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/*.cs', 'tests/PublishAppTests.ps1', 'tools/build-app.ps1', 'tools/publish-app.ps1', 'publisher.config.json', '.github/workflows/build-updater.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: khuzoe-app-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica app su cartelle di prova
        shell: pwsh
        run: ./tools/build-app.ps1 -Test
      - name: Compila eseguibile Windows
        shell: pwsh
        run: ./tools/build-app.ps1
      - name: Verifica pubblicazione e ripetizione del canale app senza rete
        shell: pwsh
        run: ./tests/PublishAppTests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KhuzoeUpdater-Windows
          path: |
            dist/KhuzoeUpdater.exe
            dist/KhuzoeUpdater.exe.config
      - name: Pubblica app se la versione è nuova
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-app.ps1
