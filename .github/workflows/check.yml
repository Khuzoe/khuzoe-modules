name: Verifica progetto
on:
  pull_request:
permissions:
  contents: read
jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/publisher.test.mjs
      - working-directory: modules/khuzoe-automations
        run: npm ci
      - run: node tools/verify-packs.mjs
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./tools/build-app.ps1 -Test
      - shell: pwsh
        run: ./tools/build-app.ps1
      - shell: pwsh
        run: ./tests/PublishAppTests.ps1
      - run: node tools/publisher.mjs preview
      - shell: pwsh
        run: |
          ./dist/KhuzoeUpdater.Tests.exe ./build/publication/site/catalog.json
          if ($LASTEXITCODE -ne 0) { throw 'Verifica pacchetti non riuscita.' }
